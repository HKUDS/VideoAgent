[project]
name = "videoagent"
version = "0.1.0"
description = "Agentic video understanding, editing, and remaking"
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai==1.60.1",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "regex",
    "loguru==0.7.3",
]

[project.urls]
Homepage = "https://github.com/HKUDS/VideoAgent"
Issues = "https://github.com/HKUDS/VideoAgent/issues"

[project.scripts]
videoagent = "videoagent_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "**/__pycache__", "**/*.pyc", "**/.env*",
    "environment/config/config.yml", "environment/config/user.yml",
]

[tool.hatch.build.targets.wheel]
only-include = ["cli_entrypoints", "environment"]
sources = { "cli_entrypoints" = "", "environment" = "videoagent_package/app/environment" }
dev-mode-dirs = ["cli_entrypoints"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "videoagent_package/app/main.py"
"requirements-runtime.txt" = "videoagent_package/app/requirements-runtime.txt"

[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml", "readme.md", "readme_zh.md", "LICENSE",
    "cli_entrypoints", "environment", "main.py", "requirements-runtime.txt",
]



